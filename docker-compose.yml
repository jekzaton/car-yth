services:
  car-yth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /ythcar
        NEXT_PUBLIC_API_URL: /ythcar

    container_name: car-yth

    ports:
      - '3001:3000'

    env_file:
      - .env

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TZ: Asia/Bangkok

    restart: unless-stopped
